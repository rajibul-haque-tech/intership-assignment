<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)" />

  <!-- Decorative Orbs -->
  <circle cx="150" cy="120" r="140" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="650" cy="380" r="160" fill="#0ea5e9" opacity="0.2" filter="url(#glow)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400" />
    <path d="M 150,0 L 150,500 M 300,0 L 300,500 M 450,0 L 450,500 M 600,0 L 600,500 M 750,0 L 750,500" />
  </g>

  <!-- Dashboard Card Glass Window -->
  <rect x="100" y="80" width="600" height="340" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <path d="M 100,96 Q 100,80 116,80 L 684,80 Q 700,80 700,96 L 700,130 L 100,130 Z" fill="rgba(0,0,0,0.25)" />
  <circle cx="130" cy="105" r="6" fill="#ef4444" />
  <circle cx="150" cy="105" r="6" fill="#f59e0b" />
  <circle cx="170" cy="105" r="6" fill="#10b981" />
  <rect x="220" y="97" width="360" height="16" rx="8" fill="rgba(255,255,255,0.1)" />

  <!-- Content Graphic Elements -->
  <!-- Stats Card 1 -->
  <rect x="130" y="160" width="160" height="100" rx="12" fill="rgba(79, 70, 229, 0.3)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
  <text x="150" y="195" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">TOTAL STUDENTS</text>
  <text x="150" y="235" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">1,480+</text>

  <!-- Stats Card 2 -->
  <rect x="310" y="160" width="160" height="100" rx="12" fill="rgba(14, 165, 233, 0.3)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <text x="330" y="195" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">AVG PERFORMANCE</text>
  <text x="330" y="235" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="800">92.4%</text>

  <!-- Stats Card 3 -->
  <rect x="490" y="160" width="180" height="100" rx="12" fill="rgba(16, 185, 129, 0.25)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
  <text x="510" y="195" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ACTIVE COURSES</text>
  <text x="510" y="235" fill="#34d399" font-family="sans-serif" font-size="28" font-weight="800">36 Modules</text>

  <!-- Chart Visual -->
  <rect x="130" y="280" width="540" height="110" rx="12" fill="rgba(15, 23, 42, 0.5)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <!-- Polyline chart line -->
  <path d="M 160,360 Q 230,310 300,340 T 440,300 T 560,330 T 640,295" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="640" cy="295" r="6" fill="#0ea5e9" stroke="#ffffff" stroke-width="2" />
</svg>
